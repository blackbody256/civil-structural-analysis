<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Running Checks · EC2 Checker</title>
  <script>(function(){var p="system";try{p=localStorage.getItem("ec2.theme")||"system"}catch(e){}var d=p==="dark"||(p!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.dataset.theme=d?"dark":"light"})();</script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231e6479'/%3E%3Crect x='12' y='6' width='8' height='20' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/run.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">EC2 Checker</span></a>
    <nav class="crumbs" aria-label="Breadcrumb"><a href="/">Elements</a><span class="sep">/</span><a id="crumb-element" href="/">Element</a><span class="sep">/</span><span>Checks</span></nav>
    <span class="spacer"></span>
    <span id="theme-slot"></span>
  </header>

  <main class="page">
    <div class="run-head">
      <h1 id="run-title">Running the checks</h1>
      <p class="lede" id="run-lede">In the order of the column design procedure.</p>
      <div class="run-progress" aria-hidden="true"><span id="run-bar"></span></div>
      <div class="run-counters" aria-live="polite">
        <span><b id="n-done">0</b> of <b id="n-total">–</b> tests</span>
        <span class="pass"><b id="n-pass">0</b> pass</span>
        <span class="fail"><b id="n-fail">0</b> fail</span>
        <span class="warn"><b id="n-warn">0</b> warnings</span>
        <span><b id="n-info">0</b> for information</span>
      </div>
    </div>

    <div class="run-layout">
      <section class="panel">
        <ol class="run-list" id="run-list"><li class="empty" style="padding:20px">Sending the inputs to the calculation engine…</li></ol>
      </section>
      <aside class="run-side">
        <section class="panel">
          <div class="panel-head"><h3>Section under test</h3><span class="hint" id="run-hint"></span></div>
          <div class="panel-body" id="run-section"></div>
        </section>
        <div class="stamp" id="stamp" aria-live="polite"></div>
        <div class="actions" style="justify-content:center">
          <button class="btn quiet small" id="skip" type="button">Skip animation</button>
          <a class="btn primary" id="open" href="/" hidden>Open the report</a>
        </div>
      </aside>
    </div>
  </main>

  <script type="module" src="/static/js/run.js"></script>
</body>
</html>
